[project]
name = "fema-oversight-mcp"
version = "1.1.0"
description = "FEMA Evidence & Oversight Graph: read-only MCP server for evidence-backed review of OpenFEMA Public Assistance data"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
fema-oversight-mcp = "fema_oversight.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fema_oversight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
