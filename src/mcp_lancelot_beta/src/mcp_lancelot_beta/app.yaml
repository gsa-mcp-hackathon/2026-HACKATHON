# Databricks Apps runtime config for mcp-lancelot-beta (Node.js).
# Apps runs `npm install` automatically because package.json is present.
# Health routes, POST /mcp (generate_diagram), startup self-test (see ARCHITECTURE.md).
command: ["node", "server.mjs"]

env:
  # Resources are configured on the app itself (UI/API), not in this file.
  - name: LLM_ENDPOINT_PRIMARY
    valueFrom: llm-primary     # -> databricks-claude-haiku-4-5 (D27)
  - name: LLM_ENDPOINT_FALLBACK
    valueFrom: llm-fallback    # -> databricks-gpt-5-4-mini (D27)
  - name: TRACE_VOLUME
    valueFrom: trace-volume    # -> users.tom_jacobson.lancelot_traces
  - name: CHOROPLETH_DATA_VOLUME
    valueFrom: choropleth-data # -> users.tom_jacobson.choropleth_data, READ_VOLUME (D41)
  - name: APP_TRACE_LEVEL
    value: debug               # debug | production
  - name: STARTUP_SELFTEST
    value: full                # full | render | off
