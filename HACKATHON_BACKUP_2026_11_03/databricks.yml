# This is a Declarative Automation Bundle definition for HACKATHON_BACKUP_2026_11_03.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: HACKATHON_BACKUP_2026_11_03
  uuid: 56d620fd-fbd4-4479-8b8d-d4176eb4f994

include:
  - resources/*.yml

# Migration bundle for the FEMA Evidence & Oversight hackathon submission
# (team: Phebe Arouni & Tom Jacobson). It recreates the app, judge package,
# data load job, dashboard, MLflow experiment and volume in a new workspace.
# Data that a bundle cannot carry (table rows, Genie space, eval dataset,
# volume files) is restored by the restore_hackathon_data job. See README.md.

# Variables. Override per target or on the command line, e.g.
#   databricks bundle deploy -t new_env --var="warehouse_id=abc123"
variables:
  catalog:
    description: Catalog for the PA table, golden eval dataset and volume
    default: workspace
  schema:
    description: Schema for the PA table, golden eval dataset and volume
    default: default
  warehouse_id:
    description: SQL warehouse ID used by the dashboard and Genie space (required in the new workspace)
  app_name:
    description: Databricks App name (lowercase letters, digits, hyphens; max 30 chars)
    default: 2026h
  model_endpoint:
    description: Model serving endpoint the AI analyst calls (FEMA_AGENT_MODEL)
    default: databricks-claude-haiku-4-5

targets:
  # Test target in the CURRENT (going-away) workspace. Creates side-by-side copies
  # so the live app 2026h is not touched.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-aae0ba16-8727.cloud.databricks.com
    variables:
      warehouse_id: 50d2bd4ddf65e0f5
      app_name: 2026h-bkp-${workspace.current_user.domain_friendly_name}

  # The NEW environment. No host is pinned: authenticate with a CLI profile
  # (-p <profile>) or DATABRICKS_HOST, and pass --var="warehouse_id=...".
  new_env:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
