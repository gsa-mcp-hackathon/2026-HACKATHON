resources:
  jobs:
    # Same as job 237307315987127 "Load FEMA Funded Projects": reloads
    # funded_projects_details from the public OpenFEMA API (serverless).
    load_fema_funded_projects:
      name: Load FEMA Funded Projects
      max_concurrent_runs: 1
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: load_fema_pa_funded_projects
          notebook_task:
            notebook_path: ../src/notebooks/Load FEMA Public Assistance Funded Projects.ipynb

    # One-time restore in the NEW workspace: golden eval dataset, volume files,
    # Genie space and MLflow run history from the snapshot in ../migration_data.
    restore_hackathon_data:
      name: Restore FEMA hackathon data
      max_concurrent_runs: 1
      tasks:
        - task_key: restore_hackathon_data
          notebook_task:
            notebook_path: ../src/notebooks/02_restore_hackathon_data.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume_name: hackathon_submissions
              warehouse_id: ${var.warehouse_id}
              experiment_name: ${resources.experiments.hackathon_eval.name}
              bundle_files_path: ${workspace.file_path}
        - task_key: load_fema_pa_table
          depends_on:
            - task_key: restore_hackathon_data
          run_job_task:
            job_id: ${resources.jobs.load_fema_funded_projects.id}
